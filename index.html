<body>
  <script>
    const password = "s";
    let enteredPassword = prompt("Enter the password:");

    if (enteredPassword === password) {
      (async () => {
        try {
          const response = await fetch('https://api.github.com/repos/bes827/reporap/contents/');
          
          if (!response.ok) {
            throw new Error(`GitHub API error: ${response.status}`);
          }

          const data = await response.json();

          if (!Array.isArray(data)) {
            throw new Error("Unexpected response structure from GitHub API.");
          }

          // Custom sort: Dated files first (newest to oldest), non-dated files at the bottom
          const dateRegex = /^\d{4}_\d{2}_\d{2}/;

          data.sort((a, b) => {
            const aHasDate = dateRegex.test(a.name);
            const bHasDate = dateRegex.test(b.name);

            if (aHasDate && bHasDate) {
              // Both have dates: Sort newest first (descending)
              return b.name.localeCompare(a.name);
            } else if (aHasDate && !bHasDate) {
              // 'a' has a date, 'b' does not -> 'a' comes first
              return -1;
            } else if (!aHasDate && bHasDate) {
              // 'b' has a date, 'a' does not -> 'b' comes first
              return 1;
            } else {
              // Neither has a date: Sort alphabetically (A to Z)
              return a.name.localeCompare(b.name);
            }
          });

          let tableString = '<table><tbody>';

          for (let file of data) {
            if (file.name !== 'upload.html' && file.name !== 'README.md' && file.name !== 'index.html') {
              // Remove extension from displayed title
              const fileTitle = file.name.replace(/\.[^/.]+$/, "");
              tableString += `
                <tr>
                  <td>
                    <a href="${file.path}" target="_blank">${fileTitle}</a>
                    <a href="https://via.hypothes.is/https://bes827.github.io/reporap/${file.path}" target="_blank"> 📜📜 </a>
                  </td>
                </tr>`;
            }
          }

          tableString += '</tbody></table>';
          let uploadLink = '<a href="upload.html" target="_blank"><h3>UPLOAD</h3></a>';
          document.getElementsByTagName('body')[0].innerHTML = `
            <br><h2>Guidelines and Relevant Articles&nbsp;</h2><hr/><br>
            ${uploadLink}
            <hr><br>
            <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Search for files...">
            ${tableString}
          `;
        } catch (err) {
          console.error(err);
          document.getElementsByTagName('body')[0].innerHTML = `
            <br><h2>Unable to load files</h2>
            <p>${err.message}. If this is a 403 error, GitHub rate-limited your IP temporarily. Please wait a few minutes and refresh.</p>
          `;
        }
      })();
    } else {
      document.getElementsByTagName('body')[0].innerHTML = "Incorrect password. Please try again.";
    }

    function filterTable() {
      let input = document.getElementById("searchInput");
      let filter = input.value.toUpperCase();
      let table = document.getElementsByTagName("table")[0];
      let rows = table.getElementsByTagName("tr");

      for (let i = 0; i < rows.length; i++) {
        let link = rows[i].getElementsByTagName("a")[0];
        if (link) {
          let text = link.textContent || link.innerText;
          rows[i].style.display = text.toUpperCase().indexOf(filter) > -1 ? "" : "none";
        }
      }
    }
  </script>
</body>
